name: PithWire Cron Trigger (Failover for CF scheduled)

# CF scheduled() + AI Gateway が本線（wrangler.toml の [triggers] :07 UTC）。
# 本 GHA は :31 UTC で失敗時の catchup として動く:
#   - catchup=1 → worker 側で last_run < 4h なら即 skip（平常時ほぼノーコスト）
#   - scheduled() が失敗 / 発火をスキップした場合のみ実質動作
# Public repo なので Actions 無制限無料。
#
# 2026-09-11 更新:
#   - fr を対象言語に追加（Phase 5.1 で追加された 6 言語目、それまで failover から漏れていた）
#   - CF WAF に "Allow PithWire cron" custom rule を配置し、Super Bot Fight Mode の
#     Managed Challenge をスキップ（以前は全 curl 呼び出しが 403 で silent-fail していた）

on:
  schedule:
    - cron: '31 */6 * * *'   # 1日4回（0:31, 6:31, 12:31, 18:31 UTC）素数分、CF :07 の 24 分後
                             # ※ GHA は free tier で 2-5h 遅延の実績あり。20分以上離さないと race で
                             # catchup が CF を追い越す事故が発生する（2033 Journey 2026-04-15 実測）
  workflow_dispatch:         # 手動トリガー

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger 6-language distribution (catchup only if CF scheduled failed)
        run: |
          echo "Starting at $(date -u +%H:%M:%S) UTC"
          for LANG in ja en ko hi id fr; do
            echo ""
            echo "=== Processing $LANG ==="
            curl -sS --max-time 300 -w "\nHTTP:%{http_code} time:%{time_total}s\n" \
              "https://pithwire.com/run-news?key=${{ secrets.RUN_KEY }}&lang=$LANG&limit=8&catchup=1" || echo "(lang=$LANG failed, continuing)"
            sleep 3
          done
          echo ""
          echo "All languages processed at $(date -u +%H:%M:%S) UTC"
